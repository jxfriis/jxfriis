<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img"><title>CodexBuddy</title><style>:root{--background:#080a0d;--foreground:#f1eee7;--secondary:#a6abb5;--border:#303640;--accent:#356aff}text{font-family:Arial,Helvetica,sans-serif;fill:var(--foreground);font-weight:400}.secondary{fill:var(--secondary)}.move{animation:drift 12s ease-in-out infinite alternate;transform-origin:910px 270px}@keyframes drift{to{transform:translate(-12px,10px) rotate(-5deg)}}@media(prefers-reduced-motion:reduce){.move{animation:none}}</style><rect x="1" y="1" width="1198" height="298" rx="8" fill="var(--background)" stroke="var(--border)"/><g ><text x="40" y="68" font-size="44" letter-spacing="-1.6">CodexBuddy</text><text x="42" y="124" font-size="23" class="secondary">Codex usage and reset countdowns.</text><text x="42" y="158" font-size="23" class="secondary">A small companion for Windows.</text><text x="42" y="251" font-size="17" class="secondary">Windows · Desktop companion</text><path d="M568 230H596V202M596 230L568 202" fill="none" stroke="#eee" stroke-width="2"/></g><g transform="translate(680 44)"><rect width="454" height="212" rx="14" fill="#161b23" stroke="#414a59"/><text x="24" y="39" font-size="20">CodexBuddy</text><circle cx="423" cy="32" r="3" fill="#8a919b"/><path d="M24 58H430" stroke="#303944"/><text x="24" y="95" font-size="16" class="secondary">5-hour usage</text><rect x="24" y="111" width="404" height="5" rx="2" fill="#303846"/><rect x="24" y="111" width="255" height="5" rx="2" fill="#356aff"/><text x="24" y="156" font-size="16" class="secondary">Weekly usage</text><rect x="24" y="174" width="404" height="5" rx="2" fill="#303846"/><rect x="24" y="174" width="160" height="5" rx="2" fill="#aab4c4"/></g></svg>