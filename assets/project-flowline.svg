<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img"><title>Flowline</title><style>:root{--background:#080a0d;--foreground:#f1eee7;--secondary:#a6abb5;--border:#303640;--accent:#356aff}text{font-family:Arial,Helvetica,sans-serif;fill:var(--foreground);font-weight:400}.secondary{fill:var(--secondary)}.move{animation:drift 12s ease-in-out infinite alternate;transform-origin:910px 270px}@keyframes drift{to{transform:translate(-12px,10px) rotate(-5deg)}}@media(prefers-reduced-motion:reduce){.move{animation:none}}</style><rect x="1" y="1" width="1198" height="298" rx="8" fill="#eeece6" stroke="var(--border)"/><g style="--foreground:#171a20;--secondary:#535c67"><text x="40" y="68" font-size="44" letter-spacing="-1.6">Flowline</text><text x="42" y="124" font-size="23" class="secondary">Project boards, timelines and calendars.</text><text x="42" y="158" font-size="23" class="secondary">Local files. No account required.</text><text x="42" y="251" font-size="17" class="secondary">Windows</text><path d="M568 230H596V202M596 230L568 202" fill="none" stroke="#171a20" stroke-width="2"/></g><g transform="translate(666 38)"><path d="M0 32H488M0 96H488M0 160H488M0 224H488M64 0V224M160 0V224M256 0V224M352 0V224M448 0V224" stroke="#c9c9c3" stroke-width="1"/><rect x="19" y="43" width="174" height="38" rx="5" fill="#b5c5e9"/><rect x="114" y="107" width="176" height="38" rx="5" fill="#356aff"/><rect x="240" y="171" width="211" height="38" rx="5" fill="#d0c5b5"/><path d="M193 62H218V126H290M290 126H315V190" fill="none" stroke="#5a6372" stroke-width="1.5"/><text x="32" y="68" font-size="15" style="fill:#222c40">Plan</text><text x="129" y="132" font-size="15" style="fill:#fff">Design</text><text x="255" y="196" font-size="15" style="fill:#302b24">Review</text></g></svg>