<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img"><title>TypeScript, React, Next.js, Vite and Tailwind CSS</title><style>:root{--background:#080a0d;--foreground:#f1eee7;--secondary:#a6abb5;--border:#303640;--accent:#356aff}text{font-family:Arial,Helvetica,sans-serif;fill:var(--foreground);font-weight:400}.secondary{fill:var(--secondary)}.move{animation:drift 12s ease-in-out infinite alternate;transform-origin:910px 270px}@keyframes drift{to{transform:translate(-12px,10px) rotate(-5deg)}}@media(prefers-reduced-motion:reduce){.move{animation:none}}</style><path d="M0 1H1200" stroke="var(--border)"/><text x="0" y="57" font-size="24" class="secondary">TypeScript / React / Next.js / Vite / Tailwind CSS</text><text x="0" y="111" font-size="18" class="secondary">github.com/jxfriis</text></svg>